services: 
  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: arthub_web
    restart: always
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      # ИСПРАВЛЕНО: путь изменен на /app/staticfiles, как в Dockerfile
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_DEBUGPY=1
      - WEB_CONCURRENCY=1 # Изменено: стандартная переменная Gunicorn для воркеров
      - PYDEVD_DISABLE_FILE_VALIDATION=1 # Убирает спам дебаггера из логов
    networks:
      - arthub
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  static-init:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    volumes:
      # ИСПРАВЛЕНО: путь изменен на /app/staticfiles
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - arthub
    # ИСПРАВЛЕНО: Запуск от appuser (1000:1000). 
    # Так как в Dockerfile папки уже созданы через mkdir, root-права здесь не нужны, 
    # а запуск от appuser гарантирует правильные права на медиа-файлы.
    user: "1000:1000" 
    restart: "no"
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate
      "

  db:
    image: postgres:16
    container_name: arthub_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artsite}
      POSTGRES_USER: ${POSTGRES_USER:-artuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - arthub
    env_file:
      - ./.env

  redis:
    image: redis:7.4-alpine
    container_name: arthub_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - arthub

  celery-worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: arthub_worker
    volumes:
      - media_volume:/app/media
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=5432
      - PYDEVD_DISABLE_FILE_VALIDATION=1
    depends_on:
      - web
    networks:
      - arthub
    restart: always
    command: >
      sh -c "
        echo '⚙️ Starting Celery worker...' &&
        celery -A ArtisanHub worker -l info
      "

  celery-beat:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: arthub_celery_beat
    volumes:
      - media_volume:/app/media
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - web
    networks:
      - arthub
    restart: always
    command: >
      sh -c "
        echo '📅 Starting Celery beat scheduler...' &&
        celery -A ArtisanHub beat -l info
      "

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  arthub:
    driver: bridge
